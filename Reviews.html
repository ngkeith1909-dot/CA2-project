<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Café | Menu</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #F7EFE5;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #6F4E37;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .nav-link:hover {
            color: #FFD580 !important;
        }

        .menu-container {
            background: white;
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        .menu-title {
            color: #4B2E2B;
            font-weight: bold;
            font-size: 45px;
        }

        .subtitle {
            color: #A67B5B;
            margin-bottom: 40px;
        }

        .menu-item {
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
            transition: .3s;
        }

        .menu-item:hover {
            background: #FFF8F2;
        }

        .menu-item img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            color: #D17B00;
            font-size: 22px;
            font-weight: bold;
        }

        .description {
            color: gray;
            font-style: italic;
        }

        footer {
            background: #6F4E37;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>

</head>

<body>

<!-- Navigation -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            <i class="bi bi-cup-hot-fill"></i> ABC Café
        </a>

        <button class="navbar-toggler bg-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        <i class="bi bi-house-fill"></i> Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="menu.html">
                        <i class="bi bi-book-fill"></i> Menu
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-camera-fill"></i> Gallery
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-star-fill"></i> Reviews
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-envelope-fill"></i> Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>  

</nav>
